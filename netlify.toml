[build]
  command = "npm run build"
  # 수집 스크립트·키워드·워크플로만 바뀐 푸시는 배포하지 않음 (크레딧 절약).
  # 종료코드 0 = 빌드 건너뜀. 사이트 코드가 하나라도 바뀌면 평소처럼 배포.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)scripts' ':(exclude).github' ':(exclude)src/lib/sync/keywords.ts' ':(exclude)src/lib/sync/coupang-sync.ts' ':(exclude)*.md'"

# Next.js(App Router) 런타임 — SSR·ISR·API·next/og 지원.
# Netlify가 Next.js를 감지하면 자동 설치하지만 명시해 둡니다.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
