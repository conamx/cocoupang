[build]
  command = "npm run build"
  # Next.js 결과 폴더 (설정 화면 값이 비거나 틀려도 빌드가 실패하지 않게 여기서 지정)
  publish = ".next"
  # 수집 스크립트·키워드·워크플로만 바뀐 푸시는 배포하지 않음 (크레딧 절약).
  # 종료코드 0 = 빌드 건너뜀. 사이트 코드가 하나라도 바뀌면 평소처럼 배포.
  # 이전 배포 기준점이 없거나(새 사이트·첫 배포) 지금 커밋과 같으면 → 항상 빌드 (11/16 새 계정에서 첫 배포가 계속 '취소'됐던 원인)
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)scripts' ':(exclude).github' ':(exclude)src/lib/sync/keywords.ts' ':(exclude)src/lib/sync/coupang-sync.ts' ':(exclude)*.md'"

# Next.js(App Router) 런타임 — SSR·ISR·API·next/og 지원.
# Netlify가 Next.js를 감지하면 자동 설치하지만 명시해 둡니다.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
